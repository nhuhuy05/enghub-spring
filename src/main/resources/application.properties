
server.port=${PORT:8080}
server.servlet.context-path=/enghub

spring.application.name=enghub

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:enghub}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASS:123456}}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Multipart upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}
server.tomcat.max-swallow-size=${MAX_SWALLOW_SIZE:200MB}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}


# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder-root=${CLOUDINARY_FOLDER_ROOT:enghub}
cloudinary.folder-env=${CLOUDINARY_FOLDER_ENV:local}

# Gemini
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.enabled=${GEMINI_ENABLED:true}
gemini.delete-file-after-use=${GEMINI_DELETE_FILE_AFTER_USE:true}

 
# JWT Configuration
jwt.signerKey=${JWT_SIGNER_KEY}


# CORS Configuration
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

# swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
